    <script>

        function valida(){
        
            if(document.contato.nome.value==""){
                alert("Campo Vazio digite algo");
                document.contato.focus();
            }
            
               if(document.contato.email.value==""){
                alert("Campo Vazio digite algo");
                document.email.focus();
            }

               if(document.contato.zap.value==""){
                alert("Campo Vazio digite algo");
                document.zap.focus();
            }


        }

    </script>

 <center>
